name: Build and push Docker image

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build and push S13 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: devopseasylearning/s13-training-camps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: devopseasylearning
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build --pull --tag "${IMAGE_NAME}:${GITHUB_SHA}" --tag "${IMAGE_NAME}:latest" .

      - name: Push image to Docker Hub
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

      - name: Show built image
        run: docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' "${IMAGE_NAME}"

      - name: Start container from pushed image
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"
          docker run --detach \
            --name s13-training-camps-ci \
            --publish 127.0.0.1:8080:8080 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Check health and show container
        run: |
          for attempt in $(seq 1 30); do
            if health_response=$(curl --fail --silent http://127.0.0.1:8080/health); then
              courses_response=$(curl --fail --silent --show-error http://127.0.0.1:8080/api/courses)
              printf 'Health response: %s\n' "$health_response"
              printf 'Courses API response: %s\n' "$courses_response"
              docker ps --no-trunc --filter name=s13-training-camps-ci
              docker inspect --format 'Container state: {{.State.Status}}' s13-training-camps-ci
              docker logs s13-training-camps-ci
              {
                echo '## Container smoke test'
                echo "- Image: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
                echo "- Health: \`${health_response}\`"
                echo '- Container:'
                echo '```text'
                docker ps --no-trunc --filter name=s13-training-camps-ci
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 60 seconds.' >&2
          docker ps --all --filter name=s13-training-camps-ci
          docker logs s13-training-camps-ci
          exit 1
