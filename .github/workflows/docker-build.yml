name: Build Docker Image

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build S13 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail
          image_tag="$(git rev-parse HEAD)"
          docker build --pull --tag "s13-training-camps:${image_tag}" .

      - name: Show built Docker image
        run: |
          set -euo pipefail
          image_tag="$(git rev-parse HEAD)"
          docker image ls --no-trunc \
            --format 'REPOSITORY={{.Repository}} TAG={{.Tag}} IMAGE_ID={{.ID}} SIZE={{.Size}}' \
            "s13-training-camps:${image_tag}"
