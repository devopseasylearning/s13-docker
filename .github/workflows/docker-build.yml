name: Docker build

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --file Dockerfile --tag "s13-training-camps:${GITHUB_SHA}" .
      - name: Publish image to Docker Hub
        if: github.ref == 'refs/heads/fix-restore-docker-and-course-enrollment-c1e100e' && github.event.before == '5f3f337392df4c2fb5e9c74799a9eb6d7979e458'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::The DOCKERHUB_TOKEN Actions secret is missing."
            exit 1
          fi
          image="devopseasylearning/s13-training-camps-omo:${GITHUB_SHA}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username devopseasylearning --password-stdin
          docker tag "s13-training-camps:${GITHUB_SHA}" "$image"
          docker push "$image"

  smoke-test:
    name: Run the published container
    if: github.ref == 'refs/heads/fix-restore-docker-and-course-enrollment-c1e100e' && github.event.before == 'bbcaa4bd2f59ad48f2f310446040c854899a25f2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE: devopseasylearning/s13-training-camps-omo:20f996219d54e4d00ebe93ab8c07c9a2ae499f5a
    steps:
      - name: Pull and start the container
        run: |
          docker pull "$IMAGE"
          docker run --detach --name s13-training-camps-omo --publish 127.0.0.1:8080:8080 "$IMAGE"
      - name: Show the running container and health response
        run: |
          if ! health=$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8080/health); then
            docker ps --all --filter 'name=^/s13-training-camps-omo$'
            docker logs s13-training-camps-omo
            exit 1
          fi
          {
            echo '### Running container'
            echo '```text'
            docker ps --filter 'name=^/s13-training-camps-omo$'
            printf '\nGET /health\n%s\n' "$health"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
