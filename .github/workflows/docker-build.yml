name: Build Docker image

on:
  pull_request:
  push:

jobs:
  build:
    name: Build S13 training camps image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag "s13-training-camps:${GITHUB_SHA}" .
