name: Docker build

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --file Dockerfile --tag "s13-training-camps:${GITHUB_SHA}" .
      - name: Publish image to Docker Hub
        if: github.ref == 'refs/heads/fix-restore-docker-and-course-enrollment-c1e100e' && github.event.before == '5f3f337392df4c2fb5e9c74799a9eb6d7979e458'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::The DOCKERHUB_TOKEN Actions secret is missing."
            exit 1
          fi
          image="devopseasylearning/s13-training-camps-omo:${GITHUB_SHA}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username devopseasylearning --password-stdin
          docker tag "s13-training-camps:${GITHUB_SHA}" "$image"
          docker push "$image"
