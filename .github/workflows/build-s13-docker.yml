name: Build S13 Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    name: Build and publish each pushed commit
    runs-on: [self-hosted, linux, ubuntu, docker, shell, backend]
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Docker
        run: docker version

      - name: Build and push image for every new commit
        id: build
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_DELETED: ${{ github.event.deleted }}
          DOCKERHUB_IMAGE: deveopeasylearning/s13-training-camps
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [[ "$PUSH_DELETED" == "true" ]]; then
            echo "Ref deletion; no image to build."
            exit 0
          fi

          if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            commits="$PUSH_SHA"
          else
            commits="$(git rev-list --reverse "${PUSH_BEFORE}..${PUSH_SHA}")"
            if [[ -z "$commits" ]]; then
              commits="$PUSH_SHA"
            fi
          fi

          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets before building." >&2
            exit 1
          fi

          DOCKER_CONFIG="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DOCKER_CONFIG"
          export DOCKER_CONFIG
          cleanup() {
            if [[ -f "$DOCKER_CONFIG/config.json" ]]; then
              rm -- "$DOCKER_CONFIG/config.json"
            fi
            if [[ -d "$DOCKER_CONFIG" ]]; then
              rmdir "$DOCKER_CONFIG"
            fi
          }
          trap cleanup EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

          target_sha="$(git rev-parse "$PUSH_SHA")"
          image_refs=()
          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            git checkout --detach "$commit"
            image_ref="${DOCKERHUB_IMAGE}:${commit}"
            docker build --pull --tag "$image_ref" .
            docker push "$image_ref"
            image_refs+=("$image_ref")
          done <<< "$commits"

          git checkout --detach "$target_sha"
          {
            echo "images<<IMAGE_REFS"
            printf '%s\n' "${image_refs[@]}"
            echo "IMAGE_REFS"
          } >> "$GITHUB_OUTPUT"

      - name: Show built Docker images
        env:
          IMAGE_REFS: ${{ steps.build.outputs.images }}
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_REFS" ]]; then
            echo "No images were built."
            exit 0
          fi

          printf 'Built Docker images:\n'
          while IFS= read -r image_ref; do
            [[ -n "$image_ref" ]] || continue
            docker image ls --no-trunc "$image_ref"
          done <<< "$IMAGE_REFS"
